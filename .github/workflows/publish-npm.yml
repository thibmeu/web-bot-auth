name: Publish npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build
      - run: npm run test

      - name: Publish packages
        run: |
          for package in http-message-sig jsonwebkey-thumbprint web-bot-auth; do
            version=$(node -p "require('./packages/$package/package.json').version")
            if published=$(npm view "$package@$version" version 2>/dev/null) && [ "$published" = "$version" ]; then
              echo "$package@$version is already published"
            else
              npm publish -w "$package" --access public
            fi
          done
